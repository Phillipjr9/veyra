<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#ede7fc" />
      <stop offset="55%" stop-color="#cfbdf8" />
      <stop offset="100%" stop-color="#8c6fe6" />
    </radialGradient>
    
    <!-- Body Clay Gradient -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a5ddf" />
      <stop offset="100%" stop-color="#3d2b6b" />
    </linearGradient>

    <!-- Head Clay Gradient (Warm skin tone with 3D clay lighting) -->
    <radialGradient id="headGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffe6d4" />
      <stop offset="60%" stop-color="#f5bd98" />
      <stop offset="100%" stop-color="#cf8c63" />
    </radialGradient>

    <!-- Hair 3D Gloss -->
    <linearGradient id="hairGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3e2723" />
      <stop offset="50%" stop-color="#5d4037" />
      <stop offset="100%" stop-color="#271612" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="clayShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#3c246b" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Ambient Circle Frame -->
  <circle cx="80" cy="80" r="80" fill="url(#bgGrad)" />

  <!-- Inner Soft Ring Highlight -->
  <circle cx="80" cy="80" r="77" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2.5" />

  <!-- Torso / Shoulders with Clay Shader -->
  <path d="M24 160 C24 122, 52 110, 80 110 C108 110, 136 122, 136 160 Z" fill="url(#bodyGrad)" filter="url(#clayShadow)" />
  
  <!-- Collar / Hoodie V-accent -->
  <path d="M68 112 Q80 126 92 112" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Neck -->
  <rect x="71" y="88" width="18" height="24" rx="9" fill="#e5a882" />

  <!-- Head / Face (Clay Sphere) -->
  <circle cx="80" cy="64" r="32" fill="url(#headGrad)" filter="url(#clayShadow)" />

  <!-- 3D Hair Volumetric Shell -->
  <path d="M48 60 C46 36, 62 26, 80 26 C98 26, 114 36, 112 60 C106 50, 96 46, 80 46 C64 46, 54 50, 48 60 Z" fill="url(#hairGrad)" filter="url(#clayShadow)" />

  <!-- Left Eye with 3D Specular catchlight -->
  <ellipse cx="69" cy="65" rx="3.6" ry="4.4" fill="#2d1b14" />
  <circle cx="67.8" cy="63.4" r="1.3" fill="#ffffff" />

  <!-- Right Eye with 3D Specular catchlight -->
  <ellipse cx="91" cy="65" rx="3.6" ry="4.4" fill="#2d1b14" />
  <circle cx="89.8" cy="63.4" r="1.3" fill="#ffffff" />

  <!-- Eyebrows -->
  <path d="M64 57 Q70 55 75 57" stroke="#3e2723" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <path d="M85 57 Q90 55 96 57" stroke="#3e2723" stroke-width="2.2" stroke-linecap="round" fill="none" />

  <!-- Cute Stylized Nose -->
  <path d="M78.5 69 Q80 72 81.5 69" stroke="#cf8c63" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Cheerful Clay Smile -->
  <path d="M73 76 Q80 82 87 76" stroke="#b05d42" stroke-width="2.6" stroke-linecap="round" fill="none" />

  <!-- Soft Cheek Rosy Blushes -->
  <ellipse cx="62" cy="71" rx="4.5" ry="3" fill="#ff7070" opacity="0.32" />
  <ellipse cx="98" cy="71" rx="4.5" ry="3" fill="#ff7070" opacity="0.32" />
</svg>
